name: Release Docker

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name != 'release/mom-calendar'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: inseok9068

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      - name: Scan secrets
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash ./task.sh gitleaks --ci

      - name: Prepare commit message
        id: prep_commit
        shell: bash
        run: |
          {
            echo "commit_message<<EOF"
            git log -1 --pretty=%B | head -n 1 | cut -c -200
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve service from branch
        id: svc
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SERVICE="${BRANCH_NAME#release/}"

          if [[ "$SERVICE" == "$BRANCH_NAME" || -z "$SERVICE" ]]; then
            echo "Branch must be release/<service>. current=$BRANCH_NAME"
            exit 1
          fi

          if [[ ! "$SERVICE" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid service name: $SERVICE"
            exit 1
          fi

          APP_DIR="apps/${SERVICE}"
          DOCKERFILE="${APP_DIR}/Dockerfile"

          if [[ ! -d "$APP_DIR" ]]; then
            echo "Service directory not found: $APP_DIR"
            exit 1
          fi

          if [[ ! -f "$DOCKERFILE" ]]; then
            echo "Dockerfile not found: $DOCKERFILE"
            exit 1
          fi

          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "compose_service=${SERVICE}-pocketpages" >> "$GITHUB_OUTPUT"
          echo "app_dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest PocketBase version
        id: pb
        shell: bash
        run: |
          set -euo pipefail
          CURL_RETRY=(--retry 5 --retry-delay 5 --retry-max-time 120 --retry-all-errors --retry-connrefused)
          LATEST_JSON="$(curl -fsSL "${CURL_RETRY[@]}" --get \
            'https://ganigeorgiev.com/api/collections/releases/records' \
            --data-urlencode 'perPage=1' \
            --data-urlencode 'skipTotal=1' \
            --data-urlencode 'sort=-semver' \
            --data-urlencode 'filter=channel.name="default" && channel.repository.name="pocketbase" && channel.repository.project.name="pocketbase"')"
          PB_VERSION="$(printf '%s' "$LATEST_JSON" | jq -er '.items[0].tag | select(type == "string") | ltrimstr("v")')"

          if [[ ! "$PB_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Failed to resolve PocketBase version"
            exit 1
          fi

          echo "version=${PB_VERSION}" >> "$GITHUB_OUTPUT"
          echo "PocketBase version: v${PB_VERSION}"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.svc.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PB_VERSION=${{ steps.pb.outputs.version }}
          tags: |
            ${{ steps.svc.outputs.image }}:${{ github.sha }}
            ${{ steps.svc.outputs.image }}:release
          cache-from: type=gha,scope=${{ steps.svc.outputs.service }}
          cache-to: type=gha,mode=max,scope=${{ steps.svc.outputs.service }}

      - name: Restart Server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          PP_DEPLOY_SERVICE: ${{ steps.svc.outputs.service }}
          PP_DEPLOY_IMAGE: ${{ steps.svc.outputs.image }}
          PP_DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_ID }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          port: 22
          envs: PP_DEPLOY_SERVICE,PP_DEPLOY_IMAGE,PP_DEPLOY_SHA
          script_path: scripts/docker-release.sh

      - name: Clean up old container versions
        id: cleanup
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ env.IMAGE_OWNER }}
          package-name: ${{ steps.svc.outputs.service }}
          package-type: container
          # Registry retention is separate from success history; rollback checks pull before stopping.
          min-versions-to-keep: 10
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report container cleanup failure
        if: steps.cleanup.outcome == 'failure'
        run: echo "::warning::Container version cleanup failed; deployment already completed."

      - name: Send Build Success
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        if: success()
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ✅ **Build Success**
            *Branch:* `${{ github.ref_name }}`
            *Service:* `${{ steps.svc.outputs.compose_service }}`
            *PocketBase:* `v${{ steps.pb.outputs.version }}`
            *Commit:* `${{ steps.prep_commit.outputs.commit_message }}`
            [View Commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

      - name: Send Build Failure
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        if: failure()
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ **Build Failed**
            *Branch:* `${{ github.ref_name }}`
            *Service:* `${{ steps.svc.outputs.compose_service }}`
            *PocketBase:* `v${{ steps.pb.outputs.version }}`
            *Commit:* `${{ steps.prep_commit.outputs.commit_message }}`
            [View Logs](https://github.com/${{ github.repository }}/actions)
