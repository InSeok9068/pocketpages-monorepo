title = "PocketPages Monorepo Gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "PocketBase upstream docs contain example JWT responses."
targetRules = ["jwt"]
paths = ['''^\.docs/pocketbase/pocketbase_docs_js\.md$''']

[[allowlists]]
description = "PocketBase JSVM SDK patch files contain generated code that matches generic-api-key."
targetRules = ["generic-api-key"]
paths = [
  '''^apps/[^/]+/patches/pocketbase-js-sdk-jsvm\+\d+\.\d+\.\d+\.patch$''',
  '''^scripts/patches/pocketbase-js-sdk-jsvm\+\d+\.\d+\.\d+\.patch$''',
  '''^\.backup/patches/pocketbase-js-sdk-jsvm\+\d+\.\d+\.\d+\.patch$''',
]

[[allowlists]]
description = "Official PocketBase browser SDK bundles contain generated code that matches generic-api-key."
targetRules = ["generic-api-key"]
paths = [
  '''^scripts/vendor/pocketbase-0\.\d+\.\d+\.umd\.js$''',
  '''^apps/todo/pb_hooks/pages/assets/vendor/pocketbase-0\.\d+\.\d+\.umd\.js$''',
]

[[allowlists]]
description = "Modern Web Guidance encryption examples contain algorithm names that match generic-api-key."
targetRules = ["generic-api-key"]
paths = [
  '''^\.agents/skills/modern-web-guidance/guides/security/client-side-encryption\.md$''',
  '''^\.claude/skills/modern-web-guidance/guides/security/client-side-encryption\.md$''',
]

[[allowlists]]
description = "Seedlab Toss API docs contain example access_token fields."
targetRules = ["generic-api-key"]
paths = ['''^apps/seedlab/\.docs/tossapi\.json$''']
